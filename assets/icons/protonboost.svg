<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#322a68"/>
      <stop offset="0.55" stop-color="#4b339a"/>
      <stop offset="1" stop-color="#8a4fe0"/>
    </linearGradient>
    <mask id="swoosh-cut">
      <rect width="512" height="512" fill="#fff"/>
      <path d="M 108 456 Q 178 415 324 240" fill="none" stroke="#000" stroke-width="78" stroke-linecap="round"/>
    </mask>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- window frame, broken where the swoosh passes -->
  <g mask="url(#swoosh-cut)" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round">
    <rect x="97" y="103" width="313" height="280" rx="28"/>
    <line x1="97" y1="172" x2="410" y2="172" stroke-width="16"/>
  </g>
  <g fill="#ffffff">
    <circle cx="140" cy="137" r="12"/>
    <circle cx="177" cy="137" r="12"/>
    <circle cx="214" cy="137" r="12"/>
  </g>

  <!-- boost swoosh (tapered) -->
  <path d="M 68 448 Q 172 388 326 238 Q 182 446 150 464 Z" fill="#ffffff"/>
  <!-- arrow head -->
  <path d="M 284 206 L 358 226 L 334 294" fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
