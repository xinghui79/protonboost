<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <mask id="arrow-cut">
      <rect width="512" height="512" fill="#fff"/>
      <path d="M 205 300 L 410 95" fill="none" stroke="#000" stroke-width="84" stroke-linecap="round"/>
    </mask>
  </defs>

  <!-- near-black squircle, ChatGPT-style -->
  <rect width="512" height="512" rx="115" fill="#0f0f0f"/>

  <!-- window outline, broken where the arrow breaks out -->
  <g mask="url(#arrow-cut)">
    <rect x="112" y="148" width="252" height="252" rx="56" fill="none" stroke="#ffffff" stroke-width="36"/>
  </g>

  <!-- launch arrow: diagonal from inside the window to the top-right corner -->
  <path d="M 205 300 L 355 150" fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="round"/>
  <path d="M 270 100 H 410 V 240" fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
