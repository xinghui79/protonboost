<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#2b3038"/>
      <stop offset="1" stop-color="#0f1114"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffc76b"/>
      <stop offset="1" stop-color="#ef8c2b"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 底板 -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#ink)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#gloss)"/>
  <rect x="16.5" y="16.5" width="479" height="479" rx="111.5" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>

  <!-- 一个 W：中间那道竖折压短一点，像两扇窗并排 -->
  <path d="M 146 176 L 206 330 L 256 238 L 306 330 L 366 176"
        fill="none" stroke="url(#amber)" stroke-width="37"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
