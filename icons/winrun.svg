<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#3a3f48"/>
      <stop offset="1" stop-color="#14161a"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#ffc76b"/>
      <stop offset="1" stop-color="#f0912f"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 底板：圆角方块 + 顶部高光 -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#ink)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#gloss)"/>
  <rect x="16.5" y="16.5" width="479" height="479" rx="111.5" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>

  <!-- 后面那层：空的窗口框 -->
  <rect x="196" y="118" width="196" height="196" rx="46" fill="none" stroke="#ffffff" stroke-opacity="0.30" stroke-width="11"/>

  <!-- 前面那层：运行中的程序 -->
  <rect x="112" y="196" width="196" height="196" rx="46" fill="url(#amber)"/>
  <path d="M 186 254 L 186 334 L 258 294 Z" fill="#17191d"/>
</svg>
