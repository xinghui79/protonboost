<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#2b3038"/>
      <stop offset="1" stop-color="#0f1114"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffc76b"/>
      <stop offset="1" stop-color="#ef8c2b"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 底板 -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#ink)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#gloss)"/>

  <!-- 后面那扇窗：空的 -->
  <rect x="196" y="104" width="220" height="220" rx="52" fill="none"
        stroke="#ffffff" stroke-opacity="0.26" stroke-width="13"/>
  <path d="M 196 162 H 416" stroke="#ffffff" stroke-opacity="0.26" stroke-width="13"/>

  <!-- 前面那扇窗：里面那个 Windows 程序，正跑着 -->
  <rect x="96" y="188" width="220" height="220" rx="52" fill="url(#amber)"/>
  <path d="M 96 246 H 316" stroke="#0f1114" stroke-opacity="0.18" stroke-width="13"/>
</svg>
